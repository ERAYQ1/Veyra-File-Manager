[workspace]
resolver = "2"
members = [
    "crates/veyra-core",
    "crates/veyra-filesystem",
    "crates/veyra-search",
    "crates/veyra-ui",
    "crates/veyra-app",
]

[workspace.package]
version = "1.0.0"
edition = "2021"
rust-version = "1.85"
license = "GPL-3.0-or-later"
authors = ["Veyra Contributors"]
repository = "https://github.com/ERAYQ1/Veyra-File-Manager"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt", "time"] }
uuid = { version = "1", features = ["v4"] }
chrono = "0.4"
anyhow = "1"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "unwind"
