name: Release

on:
  push:
    tags: ['v*']

env:
  CARGO_TERM_COLOR: always

jobs:
  build-and-release:
    name: Build & Publish Release
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-4-dev libadwaita-1-dev libglib2.0-dev
      - name: Build release binary
        run: cargo build --release --locked --workspace
      - name: Strip binary
        run: strip target/release/veyra
      - name: Package tarball
        id: package
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          PKG_NAME="veyra-${GITHUB_REF_NAME}-x86_64-linux"
          STAGE_DIR="$(mktemp -d)/${PKG_NAME}"
          mkdir -p "${STAGE_DIR}"
          cp target/release/veyra "${STAGE_DIR}/"
          cp -r data "${STAGE_DIR}/"
          cp README.md LICENSE CHANGELOG.md "${STAGE_DIR}/"
          tar -czf "${PKG_NAME}.tar.gz" -C "$(dirname "${STAGE_DIR}")" "${PKG_NAME}"
          sha256sum "${PKG_NAME}.tar.gz" > "${PKG_NAME}.tar.gz.sha256"
          echo "pkg_name=${PKG_NAME}" >> "$GITHUB_OUTPUT"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "sha256=$(cut -d' ' -f1 "${PKG_NAME}.tar.gz.sha256")" >> "$GITHUB_OUTPUT"
      - name: Generate categorized release notes
        id: notes
        run: |
          PREVIOUS_TAG="$(git describe --tags --abbrev=0 "${GITHUB_REF_NAME}^" 2>/dev/null || true)"
          if [ -n "${PREVIOUS_TAG}" ]; then
            python3 scripts/generate_release_notes.py \
              --version "${{ steps.package.outputs.version }}" \
              --from "${PREVIOUS_TAG}" \
              --to "${GITHUB_REF_NAME}" \
              --checksum-file "${{ steps.package.outputs.pkg_name }}.tar.gz" \
              --checksum-sha256 "${{ steps.package.outputs.sha256 }}" \
              --output release-notes.md
          else
            python3 scripts/generate_release_notes.py \
              --version "${{ steps.package.outputs.version }}" \
              --from "$(git rev-list --max-parents=0 HEAD)" \
              --to "${GITHUB_REF_NAME}" \
              --checksum-file "${{ steps.package.outputs.pkg_name }}.tar.gz" \
              --checksum-sha256 "${{ steps.package.outputs.sha256 }}" \
              --output release-notes.md
          fi
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            ${{ steps.package.outputs.pkg_name }}.tar.gz
            ${{ steps.package.outputs.pkg_name }}.tar.gz.sha256
          body_path: release-notes.md
