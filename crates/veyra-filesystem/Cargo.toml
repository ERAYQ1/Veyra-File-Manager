[package]
name = "veyra-filesystem"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
description = "Veyra filesystem abstraction layer: read/copy/move/trash, metadata, GVfs bridge."

[dependencies]
veyra-core = { path = "../veyra-core" }
thiserror.workspace = true
tracing.workspace = true
chrono.workspace = true
gio = "0.20"
glib = "0.20"
serde.workspace = true
serde_json.workspace = true
mime_guess = "2"
zip = { version = "7", default-features = false, features = ["deflate", "time"] }
tar = "0.4"
flate2 = "1"
xz2 = "0.1"
zstd = "0.13"
sevenz-rust = "0.6"
sha2 = "0.10"

[dev-dependencies]
tempfile = "3"
